name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "./gradlew build"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` compiles, then runs the unit tests and XaeroContractTest, which resolves the
      # real Xaero's World Map jar and fails if the mixin targets or render hooks it relies
      # on changed - so an incompatible Xaero update breaks CI instead of the game.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: structureoverlay
          path: build/libs/*.jar
          if-no-files-found: error
